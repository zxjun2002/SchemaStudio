name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-check:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore & Build (Release)
        run: dotnet build SchemaStudio/SchemaStudio.sln -c Release

      - name: Run Checks
        run: dotnet run --project SchemaStudio/SchemaStudio.Checks/SchemaStudio.Checks.csproj -c Release --no-build
